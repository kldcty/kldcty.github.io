<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLD</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --text: #e4e4e4;
      --text-dim: #777;
      --accent: #e8a84c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 560px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .tagline {
      color: var(--text-dim);
      font-size: 0.875rem;
      margin-bottom: 2.5rem;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      background: var(--surface);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--accent); }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }

    .card p {
      font-size: 0.8125rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .card .arrow {
      float: right;
      color: var(--accent);
      font-size: 1.25rem;
      line-height: 1;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <main>
    <h1>KLD</h1>
    <p class="tagline">量化交易 · 缠论研究</p>

    <a class="card" href="https://kldcty.github.io/fqbook/">
      <span class="arrow">&rarr;</span>
      <h2>野生量化</h2>
      <p>缠论插件、量化系统、缠中说禅 108 课完整技术文档</p>
    </a>

    <a class="card" href="https://github.com/kldcty">
      <span class="arrow">&rarr;</span>
      <h2>GitHub</h2>
      <p>开源项目与代码仓库</p>
    </a>
  </main>

  <footer>&copy; 2026 KLD</footer>
</body>
</html>
